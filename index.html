<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Example</title>
    <link rel="stylesheet" href="styles.css">
    <script src="java.js" defer> </script>
</head>
<body>
    <div class="calc">
        <input type="number" id="amount" placeholder="Enter your required amount">
        <br>
        <input type="number" id="rate" placeholder="Enter the annual Interest rate">
        <br>
        <input type="number" id="time" placeholder="Enter the required time Period">
        <input type="button" id="btn" onclick="calc()" value="go-go">

    </div>
    <div>
        <span id="output" aria-placeholder="Emi calculate">0.00</span>
    </div>
</body>
</html>
